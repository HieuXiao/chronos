<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Source for every app icon size: regenerate with `npm run icons`. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23806a"/>
      <stop offset="1" stop-color="#175746"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <!-- Crown -->
  <rect x="462" y="132" width="100" height="92" rx="30" fill="#ffffff"/>
  <!-- Ring: faint track, solid progress from 12 o'clock -->
  <circle cx="512" cy="560" r="292" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="76"/>
  <path d="M512 268 A292 292 0 1 1 220 560" fill="none" stroke="#ffffff" stroke-width="76" stroke-linecap="round"/>
  <!-- Hand -->
  <path d="M512 560 L512 390" stroke="#a6ecd2" stroke-width="64" stroke-linecap="round"/>
  <circle cx="512" cy="560" r="52" fill="#a6ecd2"/>
</svg>
